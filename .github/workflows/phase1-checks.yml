name: Weathercast checks

on:
  push:
    branches:
      - phase-1/ai-provider-abstraction
      - phase-2/weather-dashboard
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: weathercast-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Report dependency security audit
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          for (const [label, file] of [
            ["all dependencies", process.env.RUNNER_TEMP + "/npm-audit-all.json"],
            ["production dependencies", process.env.RUNNER_TEMP + "/npm-audit-production.json"],
          ]) {
            let report;
            try {
              report = JSON.parse(fs.readFileSync(file, "utf8"));
            } catch {
              console.log(label + ": npm audit did not return parseable JSON.");
              continue;
            }
            console.log(label + " summary:", JSON.stringify(report.metadata?.vulnerabilities ?? {}));
            for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
              const details = finding;
              console.log(JSON.stringify({
                package: name,
                severity: details.severity,
                direct: details.isDirect,
                range: details.range,
                fixAvailable: details.fixAvailable,
                advisories: (details.via ?? []).map((entry) =>
                  typeof entry === "string" ? entry : {
                    title: entry.title,
                    url: entry.url,
                    range: entry.range,
                  }
                ),
              }));
            }
          }
          NODE
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build with synthetic non-production secret fixtures
        env:
          GEMINI_API_KEY: WC_TEST_GEMINI_SECRET_SENTINEL_2026_11_24
          GROQ_API_KEY: WC_TEST_GROQ_SECRET_SENTINEL_2026_11_24
          TURNSTILE_SECRET_KEY: WC_TEST_TURNSTILE_SECRET_SENTINEL_2026_11_24
        run: npm run build
      - name: Verify build boundary and synthetic server-secret absence
        env:
          GEMINI_API_KEY: WC_TEST_GEMINI_SECRET_SENTINEL_2026_11_24
          GROQ_API_KEY: WC_TEST_GROQ_SECRET_SENTINEL_2026_11_24
          TURNSTILE_SECRET_KEY: WC_TEST_TURNSTILE_SECRET_SENTINEL_2026_11_24
        run: npm run check:build
