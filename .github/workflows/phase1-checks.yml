name: Weathercast checks

on:
  push:
    branches:
      - phase-1/ai-provider-abstraction
      - phase-2/weather-dashboard
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build without AI keys
        run: npm run build
      - name: Verify build boundary
        run: npm run check:build
