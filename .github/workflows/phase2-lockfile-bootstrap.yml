name: Phase 2 lockfile bootstrap

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/phase2-lockfile-bootstrap.yml

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out reviewed pull request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate reproducible npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --lockfile-version=3

      - name: Validate package-lock metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          if (lock.lockfileVersion !== 3) throw new Error("Expected npm lockfileVersion 3.");
          if (lock.packages?.[""]?.name !== pkg.name) throw new Error("Lockfile root package name mismatch.");
          if (JSON.stringify(lock.packages?.[""]?.dependencies ?? {}) !== JSON.stringify(pkg.dependencies ?? {})) {
            throw new Error("Lockfile root dependencies do not match package.json.");
          }
          if (JSON.stringify(lock.packages?.[""]?.devDependencies ?? {}) !== JSON.stringify(pkg.devDependencies ?? {})) {
            throw new Error("Lockfile root devDependencies do not match package.json.");
          }
          console.log("Lockfile metadata matches package.json.");
          NODE

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: phase2-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated lockfile to this same-repository PR branch
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No package-lock.json changes to commit."
            exit 0
          fi
          git commit -m "chore(phase2): add reproducible npm lockfile"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w 0)"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:$BRANCH_NAME"
